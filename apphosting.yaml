# Firebase App Hosting тохиргоо — https://firebase.google.com/docs/app-hosting/configure
# App Hosting нь GitHub repo-оос Cloud Build-ээр build хийж Cloud Run дээр ажиллуулна.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# NEXT_PUBLIC_* нь client-д ил гардаг public утгууд тул энд шууд бичиж болно.
# Build болон runtime-д хэрэгтэй (BUILD availability чухал — inline хийгдэнэ).
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCohBrA4n2I_Y5E9eXhIhZJvws9iKY2Das
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: hurdexpress-49cd2.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hurdexpress-49cd2
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: hurdexpress-49cd2.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "409714075005"
